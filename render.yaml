services:
  - type: web
    name: mindcare-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_NAME
        value: mindcare
      - key: ALLOWED_ORIGINS
        value: "https://mindcare-eight-dusky.vercel.app,https://mindcare-silk.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
    healthCheckPath: /api/health
    autoDeploy: true
