version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindcare-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - mindcare_db:/app/data
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: mindcare-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # 🔥 FIXED (IMPORTANT)
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mindcare_db: